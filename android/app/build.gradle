apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.techaurix.commanddeck'
    compileSdk 34

    defaultConfig {
        applicationId "com.techaurix.commanddeck"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // Committed keystore so EVERY build (local or CI) is signed with the
            // same certificate. Without this, GitHub Actions generates a fresh
            // random debug keystore on every run, and Android refuses to install
            // an update over an app signed with a different certificate â€” you'd
            // have to uninstall the old APK before every single reinstall.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
